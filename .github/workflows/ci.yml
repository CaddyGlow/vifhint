name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build debug
        run: bun run build:debug

      - name: Build release
        run: bun run build:release

      - name: Upload Chrome extension (release)
        uses: actions/upload-artifact@v4
        with:
          name: vifhint-chrome
          path: dist/

  build-firefox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Firefox release
        run: bun run build:firefox:release

      - name: Upload Firefox extension (release)
        uses: actions/upload-artifact@v4
        with:
          name: vifhint-firefox
          path: dist-firefox/
